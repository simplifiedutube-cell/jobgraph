[project]
name = "jobgraph"
version = "0.1.0"
description = "A LangGraph state-graph agent that finds, scores, tailors for, and applies to jobs."
readme = "README.md"
authors = [
    { name = "Kadiam Dhinaswara Naga Padma Rao", email = "kadiampadmarao@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "playwright>=1.49.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "jinja2>=3.1.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pyyaml>=6.0.0",
    "selectolax>=0.3.21",
    "aiosqlite>=0.22.1",
]

[project.scripts]
jobgraph = "jobgraph.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]
